# Postgres local para desarrollo y tests (misma versión mayor que RDS).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dochis
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dochis']
      interval: 1s
      retries: 30
volumes:
  pgdata:
